<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>FIELD // KIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="navOverlay" class="overlay"></div>
<div id="drawerOverlay" class="overlay drawer-overlay"></div>

<div class="shell">
  <aside class="sidebar" aria-label="Library navigation">
    <div>
      <div class="brand">
        <div class="brand-main">
          <span class="brand-field">F I E L D</span>
          <span class="brand-slash">&nbsp;//&nbsp;</span>
          <span class="brand-kit">K I T</span>
        </div>
      </div>
      <nav id="areaNav" class="area-nav"></nav>
    </div>
    <div class="sidebar-footer">
      <div class="signature">B U R N S I D //</div>
      <div class="signature-divider"></div>
      <div class="signature-est">E S T. &nbsp;2 0 2 6</div>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <button id="menuBtn" class="icon-button menu-button" type="button" aria-label="Open navigation">☰</button>
      <div class="masthead-note">
        <span class="masthead-line masthead-line-1">A working reference.</span>
        <span class="masthead-line masthead-line-2">Use responsibly.</span>
      </div>
      <div id="crumb" class="crumb"></div>
      <div id="entryCount" class="entry-count">0 ITEMS</div>
    </header>

    <section class="search-wrap">
      <label class="search-box">
        <span>&gt;</span>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Find a script or command">
        <button id="clearSearch" class="clear-button hidden" type="button" aria-label="Clear search">×</button>
      </label>
    </section>

    <section class="catalog">
      <div id="contextBar" class="context-bar hidden"></div>
      <div id="jumpBar" class="jump-bar hidden" aria-label="Jump to section"></div>
      <div id="results" class="results"></div>
      <div id="empty" class="empty hidden">No matches.</div>
    </section>
  </main>
</div>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-label">SELECTED</div>
    <button id="closeDrawer" class="icon-button" type="button" aria-label="Close">×</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<script src="catalog-data.js"></script>
<script src="field-kit-app.js"></script>
</body>
</html>
