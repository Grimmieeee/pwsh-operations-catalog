<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<title>F I E L D&nbsp;&nbsp;//&nbsp;&nbsp;K I T</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1215;
  --bg:#151b1e;
  --sidebar:#101619;
  --charcoal:#343a41;
  --charcoal-2:#2a3137;
  --panel:#1b2327;
  --panel-hi:#232c31;
  --mint:#00ffeb;
  --mint-soft:#bcffff;
  --mint-dim:#65f8cf;
  --text:#ffffff;
  --body:#e1faf2;
  --muted:#93aca4;
  --faint:#657e76;
  --line:#33444b;
  --line-soft:#27373d;
  --yellow:#ffff79;
  --red:#ffa2ae;
  --display:"Raleway","Segoe UI Variable Display","Segoe UI",sans-serif;
  --ui:"Source Sans 3","Segoe UI Variable Text","Segoe UI",sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--ui);font-size:16px}
button,input{font:inherit}
button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  justify-content:space-between;overflow:hidden;border-right:1px solid var(--line);
  background:linear-gradient(180deg,#0e1517 0%,#11171a 100%);
}
.sidebar>div:first-child{
  flex:1;min-height:0;display:flex;flex-direction:column;
}
.brand{flex:0 0 auto;}
.brand{padding:27px 20px 23px}
.brand-main{
  position:relative;display:inline-flex;align-items:baseline;gap:0;
  font-family:var(--display);font-size:19px;line-height:1;color:#ffffff;
  white-space:nowrap;
}
.brand-main::after{display:none}
.brand-field{font-weight:600;letter-spacing:.19em}
.brand-slash{margin:0 .30em;font-weight:400;letter-spacing:.08em;color:var(--mint)}
.brand-kit{font-weight:200;letter-spacing:.22em;color:#ffffff}
.nav{padding:7px 11px 24px}
.nav button{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  gap:12px;border:0;background:transparent;color:#b9d0ca;padding:11px 10px;
  text-align:left;border-radius:3px;font-family:var(--ui);font-size:15.5px;font-weight:500;
}
.nav button:hover{color:#ffffff;background:#192327}
.nav button.active{
  color:#ffffff;background:linear-gradient(90deg,rgba(0,240,181,.10),rgba(0,240,181,.025));
  box-shadow:inset 2px 0 0 var(--mint);
}
.count{color:#6c877f;font:700 10px/1 var(--mono)}
.nav button.active .count{color:var(--mint)}
.nav-sep{height:1px;background:var(--line-soft);margin:14px 0 9px}
.sidebar-footer{
  flex:0 0 auto;border-top:0;
}
.signature{
  padding:18px 20px 22px;
  font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.48em;color:var(--mint);
}
.workspace{min-width:0;background:linear-gradient(180deg,#141a1d 0%,#161e20 100%)}
.security-note{margin:0 22px 8px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:3px;color:var(--muted);font-size:14px;line-height:1.5}
.security-note summary{cursor:pointer;color:var(--body);font-weight:600}
.security-note summary:focus-visible{outline:2px solid var(--mint);outline-offset:4px}
.security-note p{max-width:85ch;margin:10px 0 0}
.security-note a{color:var(--mint-soft);text-underline-offset:3px}
@media(max-width:760px){.security-note{margin-left:12px;margin-right:12px}}
.topbar{
  height:58px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:#11171a;
}
.masthead-note{
  display:flex;align-items:baseline;gap:10px;white-space:nowrap;
  font-family:var(--display);text-transform:uppercase;line-height:1;
}
.masthead-line{display:inline-block}
.masthead-line-1{
  color:#ffffff;font-size:11.5px;font-weight:600;letter-spacing:.22em;
}
.masthead-line-2{
  color:var(--mint);font-size:10.5px;font-weight:300;letter-spacing:.28em;
}
.total{font:700 10px/1 var(--mono);color:#85a69d}
.search-wrap{padding:19px 22px 18px;background:#151d1f;border-bottom:1px solid var(--line)}
.search{
  min-height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;
  border:1px solid #46695f;background:#162224;transition:.18s ease;
}
.search:focus-within{
  border-color:var(--mint);box-shadow:0 0 0 1px rgba(0,240,181,.08),0 0 28px rgba(0,240,181,.06)
}
.prompt{color:var(--mint);font-family:var(--display);font-size:24px;font-weight:400}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:#ffffff;
  font-family:var(--ui);font-size:20px;font-weight:500;
}
.search input::placeholder{color:#819f96}
.catalog{padding:16px 22px 80px}
.jump{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 0 13px;border-bottom:1px solid var(--line)}
.jump-label{margin-right:6px;color:#83a299;font:700 10px/1 var(--mono);letter-spacing:.13em}
.jump button{
  border:1px solid #49695f;background:#162023;color:#bcddd4;padding:7px 10px;
  font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
}
.jump button:hover{color:var(--mint-soft);border-color:var(--mint)}
.section{margin-top:5px}
.section-title{
  display:flex;align-items:center;gap:13px;padding:22px 10px 14px 14px;border-bottom:1px solid var(--line);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.24em;
}
.section-title::before{content:"";width:3px;height:28px;background:var(--mint)}
.section-thin{font-size:14px;font-weight:700;color:var(--mint-soft)}
.section-bold{font-size:14px;font-weight:300;color:#a5bcb5}
.row{
  width:100%;min-height:59px;display:grid;grid-template-columns:minmax(250px,1fr) minmax(210px,.7fr) auto 16px;
  align-items:center;gap:12px;padding:10px;border:0;border-bottom:1px solid var(--line-soft);
  background:transparent;color:inherit;text-align:left;
}
.row:hover{background:linear-gradient(90deg,rgba(0,240,181,.045),rgba(0,240,181,.012))}
.row:hover .row-name{color:#ffffff}
.row:hover .row-file{opacity:.72}
.row-name{font-family:var(--ui);font-size:16.5px;font-weight:600;color:#e2f3ee}
.row-file{
  color:#607871;opacity:.56;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:700 11.6px/1.35 var(--mono);
}
.flag{font:800 11px/1 var(--mono);letter-spacing:.07em}
.change{color:var(--yellow)}
.danger{color:var(--red)}
.arrow{color:#4d7a6e;font-size:16px}
.row:hover .arrow{color:var(--mint)}
.drawer-shade{
  position:fixed;inset:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;
  transition:.17s ease;z-index:20;
}
.drawer{
  position:fixed;right:0;top:0;width:min(44vw,760px);min-width:600px;height:100vh;z-index:21;
  transform:translateX(102%);transition:.2s ease;background:#161e20;border-left:1px solid #49695f;
  overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.28);
}
body.open .drawer-shade{opacity:1;pointer-events:auto}
body.open .drawer{transform:translateX(0)}
.drawer-head{
  position:sticky;top:0;z-index:3;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--line);background:#151d1f;
}
.drawer-label{font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--mint)}
.close{
  width:32px;height:32px;border:1px solid #4d6962;background:transparent;color:#bad6cf;font-size:18px;
}
.close:hover{border-color:var(--mint);color:var(--mint-soft)}
.drawer-body{padding:29px 28px 60px}
.path{
  margin-bottom:13px;color:#aed0c8;font-family:var(--display);font-size:11px;font-weight:600;
  letter-spacing:.20em;text-transform:uppercase;
}
.hero-title{
  position:relative;display:inline-block;margin:0;color:#283430;font-family:var(--display);
  font-size:38px;font-weight:300;line-height:1.08;letter-spacing:.01em;
}
.hero-title strong{font-weight:700;color:var(--mint-soft)}
.hero-title::after{
  content:"";display:block;width:72px;height:3px;background:var(--mint);margin-top:14px;
}
.state{
  margin-top:16px;font:800 10px/1 var(--mono);letter-spacing:.08em;color:var(--mint);
}
.detail-section{margin-top:24px}
.detail-label{
  margin-bottom:10px;color:#bcddd4;font-family:var(--display);font-size:10px;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;
}
.connect-line{
  display:flex;justify-content:space-between;gap:12px;padding:12px 13px;border:1px solid #405852;
  background:#10171a;color:#ffffff;font:12px/1.5 var(--mono);
}
.copy{border:0;background:transparent;color:var(--mint);font:800 9px/1 var(--mono)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line-soft)}
.check{
  padding:11px 2px;border-bottom:1px solid var(--line-soft);color:#ddf6ee;font-size:13.5px;line-height:1.4;
}
.check::before{content:"[✓]";margin-right:8px;color:var(--mint);font-family:var(--mono)}
.note{margin-top:20px;color:#bcd8cf;font-size:14px;line-height:1.65;max-width:620px}
.action{
  margin-top:21px;border:1px solid #4d7468;background:transparent;color:var(--mint-soft);
  padding:11px 14px;font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
}
.action:hover{border-color:var(--mint);background:rgba(0,240,181,.045)}
.run-info-block{margin-top:24px}
.run-info-grid{border-top:1px solid var(--line-soft)}
.run-info-row{
  display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
.run-info-label{
  color:#7e9f96;font:800 9px/1.45 var(--mono);letter-spacing:.08em;
}
.run-info-value{
  color:#effffe;font:11px/1.5 var(--mono);overflow-wrap:anywhere;
}
.run-info-yes{color:var(--mint-soft);font-weight:700}
.run-connect{margin-top:16px}
.run-info-grid + .run-connect{margin-top:16px}
.run-info-subhead{
  margin-bottom:8px;color:#7e9f96;
  font:800 9px/1.45 var(--mono);letter-spacing:.08em;
}
.run-connect .connect-line + .connect-line{margin-top:7px}
@media(max-width:900px){
  .shell{grid-template-columns:215px minmax(0,1fr)}
  .drawer{width:70vw;min-width:0}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row-file{display:none}
}
@media(max-width:680px){
  .shell{display:block}.sidebar{display:none}.catalog,.search-wrap{padding-left:12px;padding-right:12px}
  .drawer{width:100vw}.checks{grid-template-columns:1fr}
}

/* =========================================================
   FIELD // KIT — FUNCTIONAL APP MAPPING
   Keeps the approved reference appearance while using
   the real catalog/search/navigation/drawer application.
   ========================================================= */
.hidden{display:none!important}

.overlay{
  position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.58);
  opacity:0;pointer-events:none;transition:opacity .17s ease;
}
.drawer-overlay{z-index:20}
.drawer-open .drawer-shade,
.drawer-open .drawer-overlay{opacity:1;pointer-events:auto}
.drawer-open .drawer{transform:translateX(0)}

.area-nav{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:7px 11px 24px;
  scrollbar-width:thin;scrollbar-color:#385f54 transparent;
}
.area-nav::-webkit-scrollbar{width:7px}
.area-nav::-webkit-scrollbar-track{background:transparent}
.area-nav::-webkit-scrollbar-thumb{
  background:#315249;border-radius:8px;
}
.area-nav::-webkit-scrollbar-thumb:hover{background:#467467}
.nav-primary{margin-bottom:18px}
.nav-section-label{
  margin:17px 10px 5px;color:#67837c;
  font:800 9px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;
}
.nav-bottom{
  margin-top:18px;padding-top:11px;border-top:1px solid var(--line-soft);
}
.nav-bottom .about-nav{margin-top:0;padding-top:11px;border-top:0}
.area-button{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:0;background:transparent;color:#b9d0ca;padding:11px 10px;text-align:left;
  border-radius:3px;font-family:var(--ui);font-size:15.5px;font-weight:500;
}
.area-button:hover{color:#ffffff;background:#192327}
.area-button.active{
  color:#ffffff;background:linear-gradient(90deg,rgba(0,240,181,.10),rgba(0,240,181,.025));
  box-shadow:inset 2px 0 0 var(--mint);
}
.area-count{color:#6c877f;font:700 10px/1 var(--mono)}
.area-button.active .area-count{color:var(--mint)}
.area-label{display:flex;align-items:center;min-width:0}
.nav-caret{
  margin-left:7px;color:#6c877f;font:800 10px/1 var(--mono);
  transform:rotate(0deg);transition:transform .16s ease,color .16s ease;
}
.area-button[aria-expanded="true"] .nav-caret{color:var(--mint);transform:rotate(180deg)}
.area-subnav{
  margin:2px 0 9px 13px;padding:2px 0 2px 8px;
  border-left:1px solid #2f483e;
}
.area-sub-button{
  width:100%;min-height:31px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:0;background:transparent;color:#93aca4;padding:7px 9px;text-align:left;
  font-family:var(--ui);font-size:13px;font-weight:500;
}
.area-sub-button:hover{color:#ffffff;background:#162023}
.area-sub-button.active{
  color:var(--mint-soft);background:linear-gradient(90deg,rgba(0,240,181,.075),transparent);
}
.area-sub-button.active .area-count{color:var(--mint)}
.about-nav{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}

.icon-button{
  width:32px;height:32px;display:grid;place-items:center;border:1px solid #4d6962;
  border-radius:0;background:transparent;color:#bad6cf;font-size:18px;
}
.icon-button:hover{border-color:var(--mint);color:var(--mint-soft)}
.menu-button{display:none}

.crumb{display:none}
.entry-count{font:700 10px/1 var(--mono);color:#85a69d}

.search-box{
  min-height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;
  border:1px solid #46695f;background:#162224;transition:.18s ease;
}
.search-box:focus-within{
  border-color:var(--mint);
  box-shadow:0 0 0 1px rgba(0,240,181,.08),0 0 28px rgba(0,240,181,.06);
}
.search-box>span{color:var(--mint);font-family:var(--display);font-size:24px;font-weight:400}
.search-box>.entry-count{color:#85a69d;font:400 11px/1 var(--mono);white-space:nowrap}
.search-box input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:#ffffff;
  font-family:var(--ui);font-size:20px;font-weight:500;
}
.search-box input::placeholder{color:#819f96}
.search-box input[type="search"]::-webkit-search-cancel-button{
  -webkit-appearance:none;appearance:none;display:none;
}
.search-box input[type="search"]::-ms-clear{display:none;width:0;height:0}
.clear-button{
  width:30px;height:30px;border:0;background:transparent;color:#819f96;font-size:18px;
}
.clear-button:hover{color:var(--mint-soft)}

.context-bar{
  min-height:0;color:#83a299;font:700 10px/1 var(--mono);letter-spacing:.13em;
  border-bottom:1px solid var(--line);
}
.context-bar.hidden + .jump-bar{margin-top:0}

.jump-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 0 13px;
  border-bottom:1px solid var(--line);
}
.jump-link{
  border:1px solid #49695f;background:#162023;color:#bcddd4;padding:7px 10px;
  font-family:var(--display);font-size:10px;font-weight:600;line-height:1;
  letter-spacing:.13em;text-transform:uppercase;
}
.jump-link:hover{color:var(--mint-soft);border-color:var(--mint)}

.results{min-width:0}
.group{margin-top:5px;border-bottom:0}
.group-title{
  display:flex;align-items:center;gap:13px;padding:22px 10px 14px 14px;
  border-bottom:1px solid var(--line);font-family:var(--display);
  text-transform:uppercase;letter-spacing:.24em;
}
.group-title::before{content:"";width:3px;height:28px;background:var(--mint);flex:0 0 auto}
.group-title-accent{font-size:14px;font-weight:700;color:var(--mint-soft)}
.group-title-muted{font-size:14px;font-weight:300;color:#a5bcb5}

.result{
  position:relative;width:100%;min-height:59px;display:grid;
  grid-template-columns:minmax(250px,1fr) auto 16px;
  align-items:center;gap:12px;padding:10px;border:0;border-bottom:1px solid var(--line-soft);
  background:transparent;color:inherit;text-align:left;
}
.result:hover{background:linear-gradient(90deg,rgba(0,240,181,.045),rgba(0,240,181,.012))}
.result-identity{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px}
.result-name{font-family:var(--ui);font-size:16.5px;font-weight:600;color:#e2f3ee}
.verification-seal{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:14px;height:14px;border:1px solid currentColor;border-radius:50%;
  color:#96baac;font:400 9px/1 var(--ui);letter-spacing:0;
}
.verification-legend{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin:0;color:#8fa69e;font:400 10px/1.4 var(--mono);white-space:nowrap;flex-shrink:0}
.platform-label{display:inline-flex;align-items:center;margin-top:14px;padding:5px 8px;color:#9cc0b6;border:1px solid #3b554e;background:#162023;font:800 10px/1 var(--mono);letter-spacing:.07em}
.about-security{margin:20px 0 0}
.result-version{color:#8ba69c;font:400 10px/1 var(--mono);white-space:nowrap}
.result-verified .release-version{color:#8ba69c;font-weight:400;letter-spacing:0}
.result:hover .result-name{color:#ffffff}
.result-meta{
  min-width:0;justify-self:end;display:inline-flex;align-items:center;
  color:#9cc0b6;border:1px solid #44625a;background:#162023;
  padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:800 10px/1 var(--mono);letter-spacing:.07em;
  transition:.15s ease;
}
.result-flags{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:7px;min-width:0;max-width:300px}
.result-verified{color:#a4ead3!important;border-color:#518e7b!important;gap:5px;border-radius:3px}
.release-note{margin:10px 0;color:#b8ccc5;font:12px/1.5 var(--ui)}
.result-tag{
  display:inline-flex;align-items:center;min-height:22px;padding:4px 7px;
  border:1px solid #44625a;background:#162023;color:#9cc0b6;
  font:800 9.5px/1 var(--mono);letter-spacing:.06em;white-space:nowrap;
  transition:.15s ease;
}
.result-scope{color:#9cc0b6}
.result-read{color:#9cc0b6}
.result-change{color:#ffdc67;border-color:#796c41}
.result-danger{color:#ff828e;border-color:#7d494f}
.result:hover .result-meta,
.result:hover .result-scope,
.result:hover .result-read{
  color:#f0ffff;border-color:#517b6d;background:#192a26;
}
.result:hover .result-change{
  color:var(--yellow);border-color:#897747;background:#232015;
}
.result:hover .result-danger{
  color:#ffd4da;border-color:#a75b68;background:#5c2733;
}
.result-arrow{color:#4d7a6e;font-size:16px}
.result:hover .result-arrow{color:var(--mint)}

.empty{padding:50px 10px;color:#93aca4;text-align:center;font-size:11px}

/* Real drawer mapped to the approved card */
.drawer{
  position:fixed;right:0;top:0;width:min(44vw,760px);min-width:600px;height:100vh;
  z-index:90;transform:translateX(102%);transition:.2s ease;background:#161e20;
  border-left:1px solid #49695f;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.28);
}
.drawer-open .drawer{transform:translateX(0)}
.drawer-head{
  position:sticky;top:0;z-index:3;height:54px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);
  background:#151d1f;
}
.drawer-label{
  font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.28em;
  text-transform:uppercase;color:var(--mint);
}
.drawer-body{padding:29px 28px 60px}

.item-head{padding-bottom:0;border-bottom:0}
.item-context{
  margin-bottom:13px;color:#aed0c8;font-family:var(--display);font-size:11px;
  font-weight:600;line-height:1.2;letter-spacing:.20em;text-transform:uppercase;
}
.item-title{
  position:relative;display:inline-block;margin:0;color:#ffffff;font-family:var(--display);
  font-size:38px;font-weight:300;line-height:1.08;letter-spacing:.01em;
}
.item-title-main{font-weight:300;color:#ffffff}
.item-title-accent{font-weight:700;color:#94ffef}
.item-title::after{
  content:"";display:block;width:72px;height:3px;background:var(--mint);margin-top:14px;
}
.access-state{
  margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;
}
.access-tag{
  display:inline-flex;align-items:center;min-height:24px;padding:5px 8px;
  border:1px solid #4f7067;background:#162023;
  font:800 10px/1 var(--mono);letter-spacing:.07em;white-space:nowrap;
}
.access-read{color:#cdffff;border-color:#568a7c}
.access-change{color:var(--yellow);border-color:#9b8346}
.access-danger{color:var(--red);border-color:#9c545f}

.connect-block,.workflow-block,.check-block,.command-block,.source-block,.note-block{margin-top:24px}
.objective-block{margin-top:22px;max-width:650px}
.objective-copy{
  color:#ffffff;font-size:16px;font-weight:500;line-height:1.58;
}
.section-label{
  margin-bottom:10px;color:#bcddd4;font-family:var(--display);font-size:10px;
  font-weight:700;line-height:1;letter-spacing:.24em;text-transform:uppercase;
}
.connect-line{
  display:flex;justify-content:space-between;gap:12px;padding:12px 13px;
  border:1px solid #405852;background:#10171a;
}
.connect-line code{color:#ffffff;font:12px/1.5 var(--mono);overflow-wrap:anywhere}
.copy-mini{border:0;background:transparent;color:var(--mint);font:800 9px/1 var(--mono)}
.copy-mini:hover{color:var(--mint-soft)}

.check-list{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;
  border-top:1px solid var(--line-soft);
}
.check-item{
  padding:11px 2px;border-bottom:1px solid var(--line-soft);
  color:#ddf6ee;font-size:13.5px;line-height:1.4;
}
.check-item::before{
  content:"[✓]";margin-right:8px;color:var(--mint);font-family:var(--mono);
}
.does-list .check-item::before{content:"[✓]";color:var(--mint);font-family:var(--mono)}

.note-block{margin-top:20px;color:#bcd8cf;font-size:14px;line-height:1.65;max-width:620px}
.change-note{
  margin-top:18px;padding:9px 0 9px 12px;border-left:2px solid var(--yellow);
  background:transparent;color:#ffffa5;font-size:12px;line-height:1.5;
}
.change-note.danger{border-left-color:var(--red);color:#ffd5dd}

.workflow-block{padding:12px;border:1px solid #405852;background:#141d1f}
.workflow-note{margin-bottom:10px;color:#ffffff;font-size:13px;line-height:1.55}
.sequence{display:grid;gap:5px}
.sequence-row{
  display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;
  color:#cbe4dd;font-size:9.5px;
}
.sequence-number{color:var(--mint);font-weight:900}
.sequence-current{color:#ffffff;font-weight:900}
.sequence-standalone{color:#baf0e1;font-size:8px}

.option-line{
  margin-top:10px;display:flex;align-items:center;gap:14px;padding:8px 0;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  color:#ebfff8;font-size:10px;
}
.option-label{color:var(--mint);font-weight:900;letter-spacing:.08em}
.option-values{color:#ffffff}

.command{
  margin:0;max-height:390px;overflow:auto;padding:13px;border:1px solid #405852;
  background:#0d1517;color:#ffffff;white-space:pre-wrap;overflow-wrap:anywhere;
  font:11.5px/1.62 var(--mono);
}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.action{
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #4d7468;background:transparent;color:var(--mint-soft);
  padding:0 14px;font-family:var(--display);font-size:10px;font-weight:700;
  line-height:1;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;
}
.action:hover,.action.primary:hover{
  border-color:var(--mint);background:rgba(0,240,181,.045);color:#ffffff;
}
.action.primary{border-color:#4d7468;color:var(--mint-soft)}
.source-block{padding-top:17px;border-top:1px solid var(--line-soft)}
.source-note{
  padding:13px;border:1px solid #405852;background:#10171a;
  color:#e2f6f0;font-size:11px;line-height:1.55;
}
.source-actions{display:flex;gap:7px;margin-top:8px}

.about-block{max-width:820px;padding:36px 10px 60px}
.about-kicker{
  margin-bottom:8px;color:var(--mint);font-family:var(--display);
  font-size:10px;font-weight:700;letter-spacing:.24em;
}
.about-block h2{
  margin:0 0 18px;color:#ffffff;font-family:var(--display);
  font-size:29px;font-weight:600;letter-spacing:-.01em;
}
.about-block p{max-width:760px;margin:0 0 17px;color:#d9fcff;font-size:14px;line-height:1.68}
.about-block strong{color:#ffffff}
.about-key{
  display:grid;grid-template-columns:max-content minmax(0,1fr);gap:9px 18px;
  max-width:620px;margin:22px 0;padding:16px 0;border-top:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft);color:#a5ccd5;font-size:10.5px;
}

/* Keep the palette swatches from the approved reference card. */
.palette{
  margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.swatch{min-height:72px;padding:12px;border:1px solid var(--line)}
.swatch.mint{background:var(--mint);color:#0d1a16}
.swatch.charcoal{background:var(--charcoal);color:#ffffff}
.swatch-name{font-family:var(--display);font-size:15px;font-weight:700}
.swatch-code{margin-top:4px;font:700 9px/1 var(--mono);opacity:.68}

@media(max-width:900px){
  .shell{grid-template-columns:215px minmax(0,1fr)}
  .drawer{width:70vw;min-width:0}
  .result{grid-template-columns:minmax(0,1fr) auto 16px}
  .result-meta{display:none}
}
@media(max-width:760px){
  .menu-button{display:grid}
  .shell{display:block}
  .sidebar{
    position:fixed;z-index:80;left:0;top:0;width:min(82vw,290px);
    transform:translateX(-104%);transition:transform .16s ease;
  }
  .nav-open .sidebar{transform:translateX(0)}
  .nav-open #navOverlay{opacity:1;pointer-events:auto}
  .drawer{width:100vw;min-width:0}
  .drawer-body{padding:18px 14px 46px}
  .check-list{grid-template-columns:1fr}
  .item-title{font-size:28px}
}


/* FIELD // KIT — ABOUT PAGE */
.about-block{
  max-width:860px;
  padding:42px 10px 72px;
}
.about-kicker{
  margin-bottom:15px;
  color:var(--mint);
  font-family:var(--display);
  font-size:10px;
  font-weight:700;
  letter-spacing:.28em;
  text-transform:uppercase;
}
.about-title{
  display:flex;
  align-items:baseline;
  gap:0;
  margin:0;
  color:#ffffff;
  font-family:var(--display);
  font-size:38px;
  line-height:1;
  letter-spacing:0;
}
.about-field{
  font-weight:600;
  letter-spacing:.19em;
}
.about-slash{
  margin:0 .30em;
  color:var(--mint);
  font-weight:400;
  letter-spacing:.08em;
}
.about-kit{
  color:#ffffff;
  font-weight:200;
  letter-spacing:.22em;
}
.about-rule{
  width:72px;
  height:3px;
  margin:18px 0 28px;
  background:var(--mint);
}
.about-block p{
  max-width:800px;
  margin:0 0 22px;
  color:#e2f6f0;
  font-size:14px;
  line-height:1.72;
}
.about-block .about-lede{
  color:#ffffff;
  font-size:15px;
}
.about-block strong{
  color:#ffffff;
  font-weight:600;
}
.about-key{
  display:grid;
  grid-template-columns:130px minmax(0,1fr);
  gap:0;
  max-width:650px;
  margin:30px 0 26px;
  padding:0;
  border-top:1px solid #5b6d67;
  border-bottom:1px solid #5b6d67;
}
.about-key span{
  padding:10px 0;
  border-bottom:1px solid var(--line-soft);
  color:#e2f6f0;
  font-size:11px;
  line-height:1.35;
}
.about-key span:nth-last-child(-n+2){
  border-bottom:0;
}
.about-key span:nth-child(odd){
  font-family:var(--mono);
  font-size:10px;
  font-weight:800;
  letter-spacing:.05em;
}
.about-key .access-read{color:var(--mint)}
.about-key .access-change{color:var(--yellow)}
.about-key .access-danger{color:var(--red)}
.about-foot{
  margin-top:28px!important;
  color:#93aca4!important;
  font-size:12.5px!important;
}
@media(max-width:680px){
  .about-title{font-size:30px}
  .about-key{grid-template-columns:1fr}
  .about-key span:nth-child(odd){padding-bottom:4px;border-bottom:0}
  .about-key span:nth-child(even){padding-top:0}
}


/* FIELD // KIT — ABOUT + FILENAME FINAL TWEAKS */
.about-rule{
  width:315px;
  max-width:100%;
}
.about-scope{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.about-scope span{
  display:block;
}
/* Result metadata sizing is defined in the main result badge contract. */


/* FIELD // KIT — LOCKED CARD CONTRACT */
.item-context{
  color:var(--mint);
}
.section-label{
  color:var(--mint);
}
.connect-line{
  border-color:#6c7e78;
}
.connect-line code{
  color:#ffffff;
}
.check-list{
  border-top-color:#757f7c;
}
.check-item{
  color:#ffffff;
  border-bottom-color:#757f7c;
}
.note-block{
  color:#ffffff;
}


/* FIELD // KIT — MAIN LIST BADGE CONTRACT */
.result-tag{
  font-size:9.5px;
  line-height:1;
  letter-spacing:.06em;
}


/* FIELD // KIT — MOBILE HARDENING
   Responsive-only adjustments. Desktop contract stays unchanged. */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{overflow-x:hidden}
button,a,input{-webkit-tap-highlight-color:transparent}

@media(max-width:760px){
  body.nav-open,
  body.drawer-open{overflow:hidden}

  .workspace{min-height:100dvh}

  .topbar{
    position:sticky;top:0;z-index:15;
    min-height:62px;height:auto;
    gap:10px;
    padding:
      8px max(12px,env(safe-area-inset-right))
      8px max(12px,env(safe-area-inset-left));
  }
  .menu-button{
    width:44px;height:44px;min-width:44px;min-height:44px;
    flex:0 0 44px;font-size:20px;
  }
  .masthead-note{
    flex:1;min-width:0;gap:7px;flex-wrap:wrap;
    overflow:hidden;
  }
  .masthead-line-1{font-size:10.5px;letter-spacing:.16em}
  .masthead-line-2{font-size:9.5px;letter-spacing:.18em}
  .entry-count{
    flex:0 0 auto;white-space:nowrap;font-size:9px;
  }

  .search-wrap{
    padding:
      12px max(12px,env(safe-area-inset-right))
      12px max(12px,env(safe-area-inset-left));
  }
  .search-box{
    min-height:54px;gap:9px;padding:0 11px;
  }
  .search-box>span{font-size:21px}
  .search-box input{
    font-size:17px;line-height:1.3;
  }
  .clear-button{
    width:44px;height:44px;min-width:44px;min-height:44px;
  }

  .catalog{
    padding:
      8px max(12px,env(safe-area-inset-right))
      calc(72px + env(safe-area-inset-bottom))
      max(12px,env(safe-area-inset-left));
  }
  .context-bar{
    padding:10px 0;
    line-height:1.35;
    overflow-wrap:anywhere;
  }

  .jump-bar{
    flex-wrap:nowrap;
    overflow-x:auto;
    overscroll-behavior-inline:contain;
    scrollbar-width:none;
    margin-left:-12px;margin-right:-12px;
    padding:10px 12px 13px;
    scroll-padding-inline:12px;
    -webkit-overflow-scrolling:touch;
  }
  .jump-bar::-webkit-scrollbar{display:none}
  .jump-label,.jump-link{flex:0 0 auto}
  .jump-link{
    min-height:40px;
    display:inline-flex;align-items:center;
    padding:0 11px;
  }

  .group{scroll-margin-top:74px}
  .group-title{
    gap:9px;
    padding:18px 4px 12px 8px;
    letter-spacing:.16em;
    overflow-wrap:anywhere;
  }
  .group-title::before{height:25px}
  .group-title-accent,.group-title-muted{font-size:12.5px}

  .result{
    min-height:74px;
    grid-template-columns:minmax(0,1fr) 16px;
    grid-template-areas:
      "name arrow"
      "flags arrow";
    gap:7px 10px;
    padding:11px 8px;
  }
  .result-identity{grid-area:name}
  .result-name{
    min-width:0;
    font-size:16px;
    line-height:1.28;
    overflow-wrap:anywhere;
  }
  .result-meta{display:none}
  .result-flags{
    grid-area:flags;
    justify-content:flex-start;
    flex-wrap:wrap;
    gap:6px;
  }
  .result-tag{
    min-height:24px;
    padding:5px 7px;
    font-size:9px;
  }
  .result-arrow{
    grid-area:arrow;
    align-self:center;
  }

  .sidebar{
    display:flex;
    width:min(86vw,320px);
    height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:24px 0 70px rgba(0,0,0,.42);
  }
  .brand{padding:22px 18px 18px}
  .brand-main{font-size:18px}
  .area-nav{padding-bottom:18px}
  .area-button{min-height:46px;padding:11px 10px}
  .area-sub-button{min-height:42px;padding:9px}
  .signature{
    padding:
      17px 18px
      max(20px,calc(14px + env(safe-area-inset-bottom)));
  }

  .drawer{
    width:100vw;min-width:0;
    height:100dvh;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .drawer-head{
    min-height:58px;height:auto;
    padding:
      max(7px,env(safe-area-inset-top))
      max(12px,env(safe-area-inset-right))
      7px max(14px,env(safe-area-inset-left));
  }
  .drawer-label{
    min-width:0;
    letter-spacing:.20em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #closeDrawer{
    width:44px;height:44px;min-width:44px;min-height:44px;
    flex:0 0 44px;
  }
  .drawer-body{
    padding:
      20px max(14px,env(safe-area-inset-right))
      calc(48px + env(safe-area-inset-bottom))
      max(14px,env(safe-area-inset-left));
  }
  .item-context{
    font-size:10px;line-height:1.35;letter-spacing:.14em;
    overflow-wrap:anywhere;
  }
  .item-title{
    max-width:100%;
    font-size:clamp(26px,8vw,34px);
    overflow-wrap:anywhere;
  }
  .objective-copy{font-size:15.5px;line-height:1.55}
  .access-state{gap:6px}
  .access-tag{white-space:normal;line-height:1.2}

  .connect-line{
    align-items:flex-start;
    gap:8px;
    padding:10px 10px 10px 12px;
  }
  .connect-line code{
    min-width:0;
    font-size:11px;
    line-height:1.55;
    word-break:break-word;
  }
  .copy-mini{
    width:44px;min-width:44px;height:44px;min-height:44px;
    flex:0 0 44px;
  }

  .check-list{grid-template-columns:1fr}
  .check-item{font-size:13px}
  .workflow-block{padding:10px}
  .sequence-row{
    grid-template-columns:20px minmax(0,1fr);
    gap:6px 8px;
  }
  .sequence-standalone{grid-column:2}
  .option-line{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
  }

  .command{
    max-height:46dvh;
    padding:11px;
    font-size:11px;
    line-height:1.58;
  }
  .actions,.source-actions{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  .action{
    width:100%;
    min-height:46px;
    padding:0 12px;
  }

    grid-template-columns:1fr;
    gap:3px;
    padding:10px 0;
  }
  .run-info-value{font-size:10.5px}

  .about-block{padding:28px 2px 54px}
  .about-block p{font-size:14px;line-height:1.65}

}

@media(max-width:420px){
  .topbar{gap:8px}
  .masthead-line-2{display:none}

  .search-box input{font-size:16px}
  .group-title{letter-spacing:.12em}
  .group-title-accent,.group-title-muted{font-size:12px}
  .result{padding-left:5px;padding-right:5px}
  .drawer-label{font-size:9px}
  .about-title{font-size:27px}
}

@media(hover:none) and (pointer:coarse){
  .area-button,
  .area-sub-button,
  .jump-link,
  .result,
  .action,
  .copy-mini,
  .icon-button{touch-action:manipulation}
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
  }
}

/* Compact shared detail layout. */
.drawer-body{padding:22px 26px 32px}
.item-context{margin-bottom:9px}
.objective-block,.note-block,.check-block,.command-block,.run-info-block{margin-top:20px}
.actions{margin-top:20px;gap:8px;display:flex;flex-wrap:wrap}
.action{margin-top:0}
.check-list{grid-template-columns:1fr}
.check-item{padding:8px 0}
.more-details{margin-top:16px;color:var(--body);font-size:14px;line-height:1.5}
.more-details summary{cursor:pointer;color:var(--mint-soft);font-weight:600}
.more-details p{margin:10px 0}
#sourceStatus{font-size:13px;color:var(--yellow)}
/* Stronger flags use color and borders, retaining existing type and weights. */
.result-read,.access-tag.access-read{color:#9cffe0;border-color:#3f6e5d;background:#12372d}
.result-change,.access-tag.access-change{color:#ffe68b;border-color:#786a3c;background:#3d3317}
.result-danger,.access-tag.access-danger{color:#ffb5bf;border-color:#88515b;background:#51232e}
.access-tag,.result-tag{box-shadow:none}
.actions:empty{display:none}
.more-details{margin-top:14px}
.run-info-block{margin-top:18px}
/* Task navigation and document identity reuse the existing typography. */
.result-document{color:#cbd0ff;border-color:#929de8;background:#272b46}
.workflow-link{width:100%;text-align:left;color:inherit;background:transparent;border:0;font:inherit;cursor:pointer}
.workflow-link:hover,.workflow-link:focus-visible{background:var(--panel);outline:1px solid var(--mint-soft)}
.related-block{margin-top:22px}
.related-block .actions{margin-top:10px}
</style>

<body>
<noscript><p>This catalog needs JavaScript for search and downloads. Browse the <a href="https://github.com/Grimmieeee/pwsh-operations-catalog/tree/main/published-source">published source files</a> in the repository.</p></noscript>
<div id="navOverlay" class="overlay"></div>
<div id="drawerOverlay" class="overlay drawer-overlay"></div>

<div class="shell">
  <aside class="sidebar" aria-label="Library navigation">
    <div>
      <div class="brand">
        <div class="brand-main">
          <span class="brand-field">F I E L D</span>
          <span class="brand-slash">//</span>
          <span class="brand-kit">K I T</span>
        </div>
      </div>
      <nav id="areaNav" class="nav area-nav"></nav>
    </div>
    <div class="sidebar-footer">
      <div class="signature">B U R N S I D //</div>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <button id="menuBtn" class="icon-button menu-button" type="button" aria-label="Open navigation" aria-controls="areaNav" aria-expanded="false">☰</button>
      <div class="masthead-note">
        <span class="masthead-line masthead-line-1">A working reference.</span>
        <span class="masthead-line masthead-line-2">Use responsibly.</span>
      </div>
      <div id="crumb" class="crumb"></div>
      <div id="verificationKey" class="verification-legend hidden"><span class="verification-seal" aria-hidden="true">V</span><span>Operator verified</span></div>
    </header>

    <section class="search-wrap">
      <label class="search-box">
        <span>&gt;</span>
        <input id="search" type="search" aria-label="Search all catalog sections" autocomplete="off" spellcheck="false" placeholder="Search by task, problem, script, or command">
        <span id="entryCount" class="entry-count" role="status" aria-live="polite" aria-atomic="true">(0)</span>
        <button id="clearSearch" class="clear-button hidden" type="button" aria-label="Clear search">×</button>
      </label>
    </section>

    <section class="catalog">
      <div id="contextBar" class="context-bar hidden"></div>
      <div id="jumpBar" class="jump jump-bar hidden" aria-label="Jump to section"></div>
      <div id="results" class="results"></div>
      <div id="empty" class="empty hidden">No matches.</div>
    </section>
  </main>
</div>

<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerLabel" aria-hidden="true" inert>
  <div class="drawer-head">
    <div id="drawerLabel" class="drawer-label">SELECTED</div>
    <button id="closeDrawer" class="icon-button" type="button" aria-label="Close">×</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<script src="catalog-data.js"></script>
<script src="source-integrity.js"></script>
<script src="field-kit-app.js?v=minimal-catalog-1"></script>
</body>
</html>
