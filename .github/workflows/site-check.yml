name: Site release checks
on:
  pull_request:
  push:
    branches: [main, work/friday-site-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    name: Catalog integrity and safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check catalog-data.js
          node --check site-theme.js
          node --check field-kit-app.js
          node --check source-integrity.js
          node --check connection-guidance.js
          node --check card-guidance.js
          node --check workflow-start.js
          node --check tools/catalog-commands.mjs
          node --check tools/catalog-safety-audit.mjs
      - name: Parse PowerShell sources and inline catalog commands without execution
        shell: pwsh
        run: ./tools/check-powershell.ps1
      - name: Check catalog files, checksums, policy and public source
        run: node tools/check-site.mjs
      - name: Check that the whole-catalog safety inventory matches current sources
        run: node tools/catalog-safety-audit.mjs --check
      - name: Exercise license-removal safety with offline Graph and prompt mocks
        shell: pwsh
        run: |
          ./tests/license-product-names.test.ps1
          ./tests/license-removal.test.ps1
          ./tests/license-removal.test.ps1 -Mode Assign
      - name: Screen catalog sources and shared Graph URI helpers
        shell: pwsh
        run: ./tests/catalog-safety.test.ps1
      - name: Test endpoint failure reporting offline
        shell: pwsh
        run: ./tests/result-safety.test.ps1
      - name: Test group creation and accepted-reset failure paths offline
        shell: pwsh
        run: ./tests/change-safety.test.ps1
      - name: Exercise download, clipboard and keyboard failure paths
        run: node --test tests/site-security.test.mjs tests/site-theme.test.mjs
      - name: Exercise batch 4 scoped behavioral checks without live services
        shell: pwsh
        run: |
          foreach ($focus in @('Disable','MFA','Hold','Delete','Groups','Cleanup','Recovery','Drift','Modules','Session','JumpboxSession','Execution','ThreatIntel','GitSecurity','MapKit','Storage')) {
            ./tests/batch-four.test.ps1 -Focus $focus
          }
      - name: Exercise batch 5 local setup and rendering functions offline
        shell: pwsh
        run: |
          foreach ($focus in @('Cert','Sign','GitRepo','Handoff','Preflight','Join','Basic','SeaGlass','Silicon','Cobalt','Rain','Static','Attractor')) {
            ./tests/batch-five.test.ps1 -Focus $focus
          }
