<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<title>F I E L D&nbsp;&nbsp;//&nbsp;&nbsp;K I T</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0e10;
  --bg:#101517;
  --sidebar:#0c1113;
  --charcoal:#282d32;
  --charcoal-2:#20262a;
  --panel:#151b1e;
  --panel-hi:#1b2226;
  --mint:#00f0b5;
  --mint-soft:#91ffe1;
  --mint-dim:#4ebf9f;
  --text:#eef7f4;
  --body:#adc0ba;
  --muted:#71847e;
  --faint:#4e615b;
  --line:#27343a;
  --line-soft:#1e2a2f;
  --yellow:#f1ca5d;
  --red:#ff7d86;
  --display:"Raleway","Segoe UI Variable Display","Segoe UI",sans-serif;
  --ui:"Source Sans 3","Segoe UI Variable Text","Segoe UI",sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--ui);font-size:16px}
button,input{font:inherit}
button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  justify-content:space-between;overflow:hidden;border-right:1px solid var(--line);
  background:linear-gradient(180deg,#0b1012 0%,#0d1214 100%);
}
.sidebar>div:first-child{
  flex:1;min-height:0;display:flex;flex-direction:column;
}
.brand{flex:0 0 auto;}
.brand{padding:27px 20px 23px}
.brand-main{
  position:relative;display:inline-flex;align-items:baseline;gap:0;
  font-family:var(--display);font-size:19px;line-height:1;color:#f2faf7;
  white-space:nowrap;
}
.brand-main::after{display:none}
.brand-field{font-weight:600;letter-spacing:.19em}
.brand-slash{margin:0 .30em;font-weight:400;letter-spacing:.08em;color:var(--mint)}
.brand-kit{font-weight:200;letter-spacing:.22em;color:#d9e8e3}
.nav{padding:7px 11px 24px}
.nav button{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  gap:12px;border:0;background:transparent;color:#8ea09b;padding:11px 10px;
  text-align:left;border-radius:3px;font-family:var(--ui);font-size:15.5px;font-weight:500;
}
.nav button:hover{color:#dceae6;background:#131b1e}
.nav button.active{
  color:#f3fbf8;background:linear-gradient(90deg,rgba(0,240,181,.10),rgba(0,240,181,.025));
  box-shadow:inset 2px 0 0 var(--mint);
}
.count{color:#536862;font:700 10px/1 var(--mono)}
.nav button.active .count{color:var(--mint)}
.nav-sep{height:1px;background:var(--line-soft);margin:14px 0 9px}
.sidebar-footer{
  flex:0 0 auto;border-top:0;
}
.signature{
  padding:18px 20px 22px;
  font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.48em;color:var(--mint);
}
.workspace{min-width:0;background:linear-gradient(180deg,#0f1416 0%,#111719 100%)}
.topbar{
  height:58px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:#0d1214;
}
.masthead-note{
  display:flex;align-items:baseline;gap:10px;white-space:nowrap;
  font-family:var(--display);text-transform:uppercase;line-height:1;
}
.masthead-line{display:inline-block}
.masthead-line-1{
  color:#c7d4d0;font-size:11.5px;font-weight:600;letter-spacing:.22em;
}
.masthead-line-2{
  color:var(--mint);font-size:10.5px;font-weight:300;letter-spacing:.28em;
}
.total{font:700 10px/1 var(--mono);color:#668079}
.search-wrap{padding:19px 22px 18px;background:#101618;border-bottom:1px solid var(--line)}
.search{
  min-height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;
  border:1px solid #365149;background:#111a1c;transition:.18s ease;
}
.search:focus-within{
  border-color:var(--mint);box-shadow:0 0 0 1px rgba(0,240,181,.08),0 0 28px rgba(0,240,181,.06)
}
.prompt{color:var(--mint);font-family:var(--display);font-size:24px;font-weight:400}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:#f3faf7;
  font-family:var(--ui);font-size:20px;font-weight:500;
}
.search input::placeholder{color:#637a73}
.catalog{padding:16px 22px 80px}
.jump{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 0 13px;border-bottom:1px solid var(--line)}
.jump-label{margin-right:6px;color:#657d76;font:700 10px/1 var(--mono);letter-spacing:.13em}
.jump button{
  border:1px solid #385149;background:#11191b;color:#91aaa3;padding:7px 10px;
  font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
}
.jump button:hover{color:var(--mint-soft);border-color:var(--mint)}
.section{margin-top:5px}
.section-title{
  display:flex;align-items:center;gap:13px;padding:22px 10px 14px 14px;border-bottom:1px solid var(--line);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.24em;
}
.section-title::before{content:"";width:3px;height:28px;background:var(--mint)}
.section-thin{font-size:14px;font-weight:700;color:var(--mint-soft)}
.section-bold{font-size:14px;font-weight:300;color:#7f918b}
.row{
  width:100%;min-height:59px;display:grid;grid-template-columns:minmax(250px,1fr) minmax(210px,.7fr) auto 16px;
  align-items:center;gap:12px;padding:10px;border:0;border-bottom:1px solid var(--line-soft);
  background:transparent;color:inherit;text-align:left;
}
.row:hover{background:linear-gradient(90deg,rgba(0,240,181,.045),rgba(0,240,181,.012))}
.row:hover .row-name{color:#d7e2de}
.row:hover .row-file{opacity:.72}
.row-name{font-family:var(--ui);font-size:16.5px;font-weight:600;color:#aebbb7}
.row-file{
  color:#4a5c57;opacity:.56;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:700 11.6px/1.35 var(--mono);
}
.flag{font:800 11px/1 var(--mono);letter-spacing:.07em}
.change{color:var(--yellow)}
.danger{color:var(--red)}
.arrow{color:#3b5e55;font-size:16px}
.row:hover .arrow{color:var(--mint)}
.drawer-shade{
  position:fixed;inset:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;
  transition:.17s ease;z-index:20;
}
.drawer{
  position:fixed;right:0;top:0;width:min(44vw,760px);min-width:600px;height:100vh;z-index:21;
  transform:translateX(102%);transition:.2s ease;background:#111719;border-left:1px solid #385149;
  overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.28);
}
body.open .drawer-shade{opacity:1;pointer-events:auto}
body.open .drawer{transform:translateX(0)}
.drawer-head{
  position:sticky;top:0;z-index:3;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--line);background:#101618;
}
.drawer-label{font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--mint)}
.close{
  width:32px;height:32px;border:1px solid #3b514b;background:transparent;color:#8fa59f;font-size:18px;
}
.close:hover{border-color:var(--mint);color:var(--mint-soft)}
.drawer-body{padding:29px 28px 60px}
.path{
  margin-bottom:13px;color:#86a09a;font-family:var(--display);font-size:11px;font-weight:600;
  letter-spacing:.20em;text-transform:uppercase;
}
.hero-title{
  position:relative;display:inline-block;margin:0;color:#1f2825;font-family:var(--display);
  font-size:38px;font-weight:300;line-height:1.08;letter-spacing:.01em;
}
.hero-title strong{font-weight:700;color:var(--mint-soft)}
.hero-title::after{
  content:"";display:block;width:72px;height:3px;background:var(--mint);margin-top:14px;
}
.state{
  margin-top:16px;font:800 10px/1 var(--mono);letter-spacing:.08em;color:var(--mint);
}
.detail-section{margin-top:24px}
.detail-label{
  margin-bottom:10px;color:#91aaa3;font-family:var(--display);font-size:10px;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;
}
.connect-line{
  display:flex;justify-content:space-between;gap:12px;padding:12px 13px;border:1px solid #31443f;
  background:#0c1214;color:#c8d9d4;font:12px/1.5 var(--mono);
}
.copy{border:0;background:transparent;color:var(--mint);font:800 9px/1 var(--mono)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line-soft)}
.check{
  padding:11px 2px;border-bottom:1px solid var(--line-soft);color:#aabdb7;font-size:13.5px;line-height:1.4;
}
.check::before{content:"[✓]";margin-right:8px;color:var(--mint);font-family:var(--mono)}
.note{margin-top:20px;color:#91a69f;font-size:14px;line-height:1.65;max-width:620px}
.action{
  margin-top:21px;border:1px solid #3b5950;background:transparent;color:var(--mint-soft);
  padding:11px 14px;font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
}
.action:hover{border-color:var(--mint);background:rgba(0,240,181,.045)}
.run-info-block{margin-top:24px}
.run-info-grid{border-top:1px solid var(--line-soft)}
.run-info-row{
  display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
.run-info-label{
  color:#617a73;font:800 9px/1.45 var(--mono);letter-spacing:.08em;
}
.run-info-value{
  color:#b8c8c3;font:11px/1.5 var(--mono);overflow-wrap:anywhere;
}
.run-info-yes{color:var(--mint-soft);font-weight:700}
@media(max-width:900px){
  .shell{grid-template-columns:215px minmax(0,1fr)}
  .drawer{width:70vw;min-width:0}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row-file{display:none}
}
@media(max-width:680px){
  .shell{display:block}.sidebar{display:none}.catalog,.search-wrap{padding-left:12px;padding-right:12px}
  .drawer{width:100vw}.checks{grid-template-columns:1fr}
}

/* =========================================================
   FIELD // KIT — FUNCTIONAL APP MAPPING
   Keeps the approved reference appearance while using
   the real catalog/search/navigation/drawer application.
   ========================================================= */
.hidden{display:none!important}

.overlay{
  position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.58);
  opacity:0;pointer-events:none;transition:opacity .17s ease;
}
.drawer-overlay{z-index:20}
.drawer-open .drawer-shade,
.drawer-open .drawer-overlay{opacity:1;pointer-events:auto}
.drawer-open .drawer{transform:translateX(0)}

.area-nav{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:7px 11px 24px;
  scrollbar-width:thin;scrollbar-color:#2b4941 transparent;
}
.area-nav::-webkit-scrollbar{width:7px}
.area-nav::-webkit-scrollbar-track{background:transparent}
.area-nav::-webkit-scrollbar-thumb{
  background:#263f38;border-radius:8px;
}
.area-nav::-webkit-scrollbar-thumb:hover{background:#36594f}
.nav-primary{margin-bottom:18px}
.nav-section-label{
  margin:17px 10px 5px;color:#4f655f;
  font:800 9px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;
}
.nav-bottom{
  margin-top:18px;padding-top:11px;border-top:1px solid var(--line-soft);
}
.nav-bottom .about-nav{margin-top:0;padding-top:11px;border-top:0}
.area-button{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:0;background:transparent;color:#8ea09b;padding:11px 10px;text-align:left;
  border-radius:3px;font-family:var(--ui);font-size:15.5px;font-weight:500;
}
.area-button:hover{color:#dceae6;background:#131b1e}
.area-button.active{
  color:#f3fbf8;background:linear-gradient(90deg,rgba(0,240,181,.10),rgba(0,240,181,.025));
  box-shadow:inset 2px 0 0 var(--mint);
}
.area-count{color:#536862;font:700 10px/1 var(--mono)}
.area-button.active .area-count{color:var(--mint)}
.area-label{display:flex;align-items:center;min-width:0}
.nav-caret{
  margin-left:7px;color:#536862;font:800 10px/1 var(--mono);
  transform:rotate(0deg);transition:transform .16s ease,color .16s ease;
}
.area-button.active .nav-caret{color:var(--mint);transform:rotate(180deg)}
.area-subnav{
  margin:2px 0 9px 13px;padding:2px 0 2px 8px;
  border-left:1px solid #243730;
}
.area-sub-button{
  width:100%;min-height:31px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:0;background:transparent;color:#71847e;padding:7px 9px;text-align:left;
  font-family:var(--ui);font-size:13px;font-weight:500;
}
.area-sub-button:hover{color:#c8d8d3;background:#11191b}
.area-sub-button.active{
  color:var(--mint-soft);background:linear-gradient(90deg,rgba(0,240,181,.075),transparent);
}
.area-sub-button.active .area-count{color:var(--mint)}
.about-nav{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}

.icon-button{
  width:32px;height:32px;display:grid;place-items:center;border:1px solid #3b514b;
  border-radius:0;background:transparent;color:#8fa59f;font-size:18px;
}
.icon-button:hover{border-color:var(--mint);color:var(--mint-soft)}
.menu-button{display:none}

.crumb{display:none}
.entry-count{font:700 10px/1 var(--mono);color:#668079}

.search-box{
  min-height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;
  border:1px solid #365149;background:#111a1c;transition:.18s ease;
}
.search-box:focus-within{
  border-color:var(--mint);
  box-shadow:0 0 0 1px rgba(0,240,181,.08),0 0 28px rgba(0,240,181,.06);
}
.search-box>span{color:var(--mint);font-family:var(--display);font-size:24px;font-weight:400}
.search-box input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:#f3faf7;
  font-family:var(--ui);font-size:20px;font-weight:500;
}
.search-box input::placeholder{color:#637a73}
.search-box input[type="search"]::-webkit-search-cancel-button{
  -webkit-appearance:none;appearance:none;display:none;
}
.search-box input[type="search"]::-ms-clear{display:none;width:0;height:0}
.clear-button{
  width:30px;height:30px;border:0;background:transparent;color:#637a73;font-size:18px;
}
.clear-button:hover{color:var(--mint-soft)}

.context-bar{
  min-height:0;color:#657d76;font:700 10px/1 var(--mono);letter-spacing:.13em;
  border-bottom:1px solid var(--line);
}
.context-bar.hidden + .jump-bar{margin-top:0}

.jump-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 0 13px;
  border-bottom:1px solid var(--line);
}
.jump-link{
  border:1px solid #385149;background:#11191b;color:#91aaa3;padding:7px 10px;
  font-family:var(--display);font-size:10px;font-weight:600;line-height:1;
  letter-spacing:.13em;text-transform:uppercase;
}
.jump-link:hover{color:var(--mint-soft);border-color:var(--mint)}

.results{min-width:0}
.group{margin-top:5px;border-bottom:0}
.group-title{
  display:flex;align-items:center;gap:13px;padding:22px 10px 14px 14px;
  border-bottom:1px solid var(--line);font-family:var(--display);
  text-transform:uppercase;letter-spacing:.24em;
}
.group-title::before{content:"";width:3px;height:28px;background:var(--mint);flex:0 0 auto}
.group-title-accent{font-size:14px;font-weight:700;color:var(--mint-soft)}
.group-title-muted{font-size:14px;font-weight:300;color:#7f918b}

.result{
  width:100%;min-height:59px;display:grid;
  grid-template-columns:minmax(250px,1fr) minmax(210px,.7fr) auto 16px;
  align-items:center;gap:12px;padding:10px;border:0;border-bottom:1px solid var(--line-soft);
  background:transparent;color:inherit;text-align:left;
}
.result:hover{background:linear-gradient(90deg,rgba(0,240,181,.045),rgba(0,240,181,.012))}
.result-name{font-family:var(--ui);font-size:16.5px;font-weight:600;color:#aebbb7}
.result:hover .result-name{color:#d7e2de}
.result-meta{
  min-width:0;justify-self:end;display:inline-flex;align-items:center;
  color:#78948c;border:1px solid #344b45;background:#11191b;
  padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:800 10px/1 var(--mono);letter-spacing:.07em;
  transition:.15s ease;
}
.result-flags{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0}
.result-tag{
  display:inline-flex;align-items:center;min-height:22px;padding:4px 7px;
  border:1px solid #344b45;background:#11191b;color:#78948c;
  font:800 9.5px/1 var(--mono);letter-spacing:.06em;white-space:nowrap;
  transition:.15s ease;
}
.result-scope{color:#78948c}
.result-read{color:#78948c}
.result-change{color:#c5a94f;border-color:#5d5332}
.result-danger{color:#c8646d;border-color:#60383d}
.result:hover .result-meta,
.result:hover .result-scope,
.result:hover .result-read{
  color:#b9d1c9;border-color:#4d7066;background:#13201d;
}
.result:hover .result-change{
  color:var(--yellow);border-color:#8a773c;background:#1b1910;
}
.result:hover .result-danger{
  color:var(--red);border-color:#8a4a50;background:#201214;
}
.result-arrow{color:#3b5e55;font-size:16px}
.result:hover .result-arrow{color:var(--mint)}

.empty{padding:50px 10px;color:#71847e;text-align:center;font-size:11px}

/* Real drawer mapped to the approved card */
.drawer{
  position:fixed;right:0;top:0;width:min(44vw,760px);min-width:600px;height:100vh;
  z-index:90;transform:translateX(102%);transition:.2s ease;background:#111719;
  border-left:1px solid #385149;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.28);
}
.drawer-open .drawer{transform:translateX(0)}
.drawer-head{
  position:sticky;top:0;z-index:3;height:54px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);
  background:#101618;
}
.drawer-label{
  font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.28em;
  text-transform:uppercase;color:var(--mint);
}
.drawer-body{padding:29px 28px 60px}

.item-head{padding-bottom:0;border-bottom:0}
.item-context{
  margin-bottom:13px;color:#86a09a;font-family:var(--display);font-size:11px;
  font-weight:600;line-height:1.2;letter-spacing:.20em;text-transform:uppercase;
}
.item-title{
  position:relative;display:inline-block;margin:0;color:#eef3f1;font-family:var(--display);
  font-size:38px;font-weight:300;line-height:1.08;letter-spacing:.01em;
}
.item-title-main{font-weight:300;color:#eef3f1}
.item-title-accent{font-weight:700;color:#72cbb8}
.item-title::after{
  content:"";display:block;width:72px;height:3px;background:var(--mint);margin-top:14px;
}
.access-state{
  margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;
}
.access-tag{
  display:inline-flex;align-items:center;min-height:24px;padding:5px 8px;
  border:1px solid #3d564f;background:#11191b;
  font:800 10px/1 var(--mono);letter-spacing:.07em;white-space:nowrap;
}
.access-read{color:#9ed7c8;border-color:#426a5f}
.access-change{color:var(--yellow);border-color:#776536}
.access-danger{color:var(--red);border-color:#784149}

.connect-block,.workflow-block,.check-block,.command-block,.source-block,.note-block{margin-top:24px}
.section-label{
  margin-bottom:10px;color:#91aaa3;font-family:var(--display);font-size:10px;
  font-weight:700;line-height:1;letter-spacing:.24em;text-transform:uppercase;
}
.connect-line{
  display:flex;justify-content:space-between;gap:12px;padding:12px 13px;
  border:1px solid #31443f;background:#0c1214;
}
.connect-line code{color:#c8d9d4;font:12px/1.5 var(--mono);overflow-wrap:anywhere}
.copy-mini{border:0;background:transparent;color:var(--mint);font:800 9px/1 var(--mono)}
.copy-mini:hover{color:var(--mint-soft)}

.check-list{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;
  border-top:1px solid var(--line-soft);
}
.check-item{
  padding:11px 2px;border-bottom:1px solid var(--line-soft);
  color:#aabdb7;font-size:13.5px;line-height:1.4;
}
.check-item::before{
  content:"[✓]";margin-right:8px;color:var(--mint);font-family:var(--mono);
}
.does-list .check-item::before{content:"[✓]";color:var(--mint);font-family:var(--mono)}

.note-block{margin-top:20px;color:#91a69f;font-size:14px;line-height:1.65;max-width:620px}
.change-note{
  margin-top:18px;padding:9px 0 9px 12px;border-left:2px solid var(--yellow);
  background:transparent;color:#d7c77f;font-size:12px;line-height:1.5;
}
.change-note.danger{border-left-color:var(--red);color:#e3a4aa}

.workflow-block{padding:12px;border:1px solid #31443f;background:#0f1618}
.workflow-note{margin-bottom:10px;color:#c4cfcc;font-size:13px;line-height:1.55}
.sequence{display:grid;gap:5px}
.sequence-row{
  display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;
  color:#9cafaa;font-size:9.5px;
}
.sequence-number{color:var(--mint);font-weight:900}
.sequence-current{color:#eef7f4;font-weight:900}
.sequence-standalone{color:#8fb9ad;font-size:8px}

.option-line{
  margin-top:10px;display:flex;align-items:center;gap:14px;padding:8px 0;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  color:#b5c4bf;font-size:10px;
}
.option-label{color:var(--mint);font-weight:900;letter-spacing:.08em}
.option-values{color:#dce7e3}

.command{
  margin:0;max-height:390px;overflow:auto;padding:13px;border:1px solid #31443f;
  background:#0a1012;color:#d8e4e0;white-space:pre-wrap;overflow-wrap:anywhere;
  font:11.5px/1.62 var(--mono);
}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.action{
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #3b5950;background:transparent;color:var(--mint-soft);
  padding:0 14px;font-family:var(--display);font-size:10px;font-weight:700;
  line-height:1;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;
}
.action:hover,.action.primary:hover{
  border-color:var(--mint);background:rgba(0,240,181,.045);color:#d9fff4;
}
.action.primary{border-color:#3b5950;color:var(--mint-soft)}
.source-block{padding-top:17px;border-top:1px solid var(--line-soft)}
.source-note{
  padding:13px;border:1px solid #31443f;background:#0c1214;
  color:#aebdb9;font-size:11px;line-height:1.55;
}
.source-actions{display:flex;gap:7px;margin-top:8px}

.about-block{max-width:820px;padding:36px 10px 60px}
.about-kicker{
  margin-bottom:8px;color:var(--mint);font-family:var(--display);
  font-size:10px;font-weight:700;letter-spacing:.24em;
}
.about-block h2{
  margin:0 0 18px;color:#edf2f3;font-family:var(--display);
  font-size:29px;font-weight:600;letter-spacing:-.01em;
}
.about-block p{max-width:760px;margin:0 0 17px;color:#a7c2c7;font-size:14px;line-height:1.68}
.about-block strong{color:#d8eaed}
.about-key{
  display:grid;grid-template-columns:max-content minmax(0,1fr);gap:9px 18px;
  max-width:620px;margin:22px 0;padding:16px 0;border-top:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft);color:#7f9da4;font-size:10.5px;
}

/* Keep the palette swatches from the approved reference card. */
.palette{
  margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.swatch{min-height:72px;padding:12px;border:1px solid var(--line)}
.swatch.mint{background:var(--mint);color:#0a1411}
.swatch.charcoal{background:var(--charcoal);color:#f3faf7}
.swatch-name{font-family:var(--display);font-size:15px;font-weight:700}
.swatch-code{margin-top:4px;font:700 9px/1 var(--mono);opacity:.68}

@media(max-width:900px){
  .shell{grid-template-columns:215px minmax(0,1fr)}
  .drawer{width:70vw;min-width:0}
  .result{grid-template-columns:minmax(0,1fr) auto}
  .result-meta{display:none}
}
@media(max-width:760px){
  .menu-button{display:grid}
  .shell{display:block}
  .sidebar{
    position:fixed;z-index:80;left:0;top:0;width:min(82vw,290px);
    transform:translateX(-104%);transition:transform .16s ease;
  }
  .nav-open .sidebar{transform:translateX(0)}
  .nav-open #navOverlay{opacity:1;pointer-events:auto}
  .drawer{width:100vw;min-width:0}
  .drawer-body{padding:18px 14px 46px}
  .check-list{grid-template-columns:1fr}
  .item-title{font-size:28px}
}


/* FIELD // KIT — ABOUT PAGE */
.about-block{
  max-width:860px;
  padding:42px 10px 72px;
}
.about-kicker{
  margin-bottom:15px;
  color:var(--mint);
  font-family:var(--display);
  font-size:10px;
  font-weight:700;
  letter-spacing:.28em;
  text-transform:uppercase;
}
.about-title{
  display:flex;
  align-items:baseline;
  gap:0;
  margin:0;
  color:#f2faf7;
  font-family:var(--display);
  font-size:38px;
  line-height:1;
  letter-spacing:0;
}
.about-field{
  font-weight:600;
  letter-spacing:.19em;
}
.about-slash{
  margin:0 .30em;
  color:var(--mint);
  font-weight:400;
  letter-spacing:.08em;
}
.about-kit{
  color:#d9e8e3;
  font-weight:200;
  letter-spacing:.22em;
}
.about-rule{
  width:72px;
  height:3px;
  margin:18px 0 28px;
  background:var(--mint);
}
.about-block p{
  max-width:800px;
  margin:0 0 22px;
  color:#aebdb9;
  font-size:14px;
  line-height:1.72;
}
.about-block .about-lede{
  color:#d4dfdc;
  font-size:15px;
}
.about-block strong{
  color:#dce8e4;
  font-weight:600;
}
.about-key{
  display:grid;
  grid-template-columns:130px minmax(0,1fr);
  gap:0;
  max-width:650px;
  margin:30px 0 26px;
  padding:0;
  border-top:1px solid #46544f;
  border-bottom:1px solid #46544f;
}
.about-key span{
  padding:10px 0;
  border-bottom:1px solid var(--line-soft);
  color:#aebdb9;
  font-size:11px;
  line-height:1.35;
}
.about-key span:nth-last-child(-n+2){
  border-bottom:0;
}
.about-key span:nth-child(odd){
  font-family:var(--mono);
  font-size:10px;
  font-weight:800;
  letter-spacing:.05em;
}
.about-key .access-read{color:var(--mint)}
.about-key .access-change{color:var(--yellow)}
.about-key .access-danger{color:var(--red)}
.about-foot{
  margin-top:28px!important;
  color:#71847e!important;
  font-size:12.5px!important;
}
@media(max-width:680px){
  .about-title{font-size:30px}
  .about-key{grid-template-columns:1fr}
  .about-key span:nth-child(odd){padding-bottom:4px;border-bottom:0}
  .about-key span:nth-child(even){padding-top:0}
}


/* FIELD // KIT — ABOUT + FILENAME FINAL TWEAKS */
.about-rule{
  width:315px;
  max-width:100%;
}
.about-scope{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.about-scope span{
  display:block;
}
/* Result metadata sizing is defined in the main result badge contract. */


/* FIELD // KIT — LOCKED CARD CONTRACT */
.item-context{
  color:var(--mint);
}
.section-label{
  color:var(--mint);
}
.connect-line{
  border-color:#53615c;
}
.connect-line code{
  color:#eef3f1;
}
.check-list{
  border-top-color:#5a625f;
}
.check-item{
  color:#d7e0dd;
  border-bottom-color:#5a625f;
}
.note-block{
  color:#d1dbd8;
}


/* FIELD // KIT — MAIN LIST BADGE CONTRACT */
.result-tag{
  font-size:9.5px;
  line-height:1;
  letter-spacing:.06em;
}

</style>
</head>
<body>
<div id="navOverlay" class="overlay"></div>
<div id="drawerOverlay" class="overlay drawer-overlay"></div>

<div class="shell">
  <aside class="sidebar" aria-label="Library navigation">
    <div>
      <div class="brand">
        <div class="brand-main">
          <span class="brand-field">F I E L D</span>
          <span class="brand-slash">//</span>
          <span class="brand-kit">K I T</span>
        </div>
      </div>
      <nav id="areaNav" class="nav area-nav"></nav>
    </div>
    <div class="sidebar-footer">
      <div class="signature">B U R N S I D //</div>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <button id="menuBtn" class="icon-button menu-button" type="button" aria-label="Open navigation">☰</button>
      <div class="masthead-note">
        <span class="masthead-line masthead-line-1">A working reference.</span>
        <span class="masthead-line masthead-line-2">Use responsibly.</span>
      </div>
      <div id="crumb" class="crumb"></div>
      <div id="entryCount" class="entry-count">0 ITEMS</div>
    </header>

    <section class="search-wrap">
      <label class="search-box">
        <span>&gt;</span>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Find a script or command">
        <button id="clearSearch" class="clear-button hidden" type="button" aria-label="Clear search">×</button>
      </label>
    </section>

    <section class="catalog">
      <div id="contextBar" class="context-bar hidden"></div>
      <div id="jumpBar" class="jump jump-bar hidden" aria-label="Jump to section"></div>
      <div id="results" class="results"></div>
      <div id="empty" class="empty hidden">No matches.</div>
    </section>
  </main>
</div>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-label">SELECTED</div>
    <button id="closeDrawer" class="icon-button" type="button" aria-label="Close">×</button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<script src="catalog-data.js"></script>
<script src="field-kit-app.js"></script>
</body>
